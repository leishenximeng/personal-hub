services:
  postgres:
    image: postgres:16
    container_name: personal-hub-postgres

    environment:
      POSTGRES_DB: personal_hub
      POSTGRES_USER: personalhub
      POSTGRES_PASSWORD: personalhub_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: